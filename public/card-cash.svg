<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 540" width="856" height="540">
  <defs>
    <!-- Card Background Gradient -->
    <linearGradient id="emeraldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06321d"/>
      <stop offset="35%" stop-color="#0a4327"/>
      <stop offset="70%" stop-color="#072d1a"/>
      <stop offset="100%" stop-color="#03180e"/>
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe28a"/>
      <stop offset="25%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#fff1b8"/>
      <stop offset="75%" stop-color="#aa8214"/>
      <stop offset="100%" stop-color="#f5d77f"/>
    </linearGradient>

    <!-- Metallic Chip Gradient -->
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>

    <!-- Card Rim Bevel -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Subtle Radial Sheen -->
    <radialGradient id="sheen" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#059669" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Card Body with Rounded Edges -->
  <rect x="2" y="2" width="852" height="536" rx="38" ry="38" fill="url(#emeraldBg)"/>
  <rect x="2" y="2" width="852" height="536" rx="38" ry="38" fill="url(#sheen)"/>
  <rect x="2" y="2" width="852" height="536" rx="38" ry="38" fill="none" stroke="url(#rimGrad)" stroke-width="4"/>

  <!-- Guilloche Security Pattern Lines -->
  <g opacity="0.12" stroke="#d4af37" stroke-width="1.2" fill="none">
    <ellipse cx="428" cy="270" rx="380" ry="220" />
    <ellipse cx="428" cy="270" rx="350" ry="200" />
    <ellipse cx="428" cy="270" rx="320" ry="180" />
    <ellipse cx="428" cy="270" rx="290" ry="160" />
    <ellipse cx="428" cy="270" rx="260" ry="140" />
    <ellipse cx="428" cy="270" rx="230" ry="120" />
    <ellipse cx="750" cy="120" rx="160" ry="160" />
    <ellipse cx="750" cy="120" rx="130" ry="130" />
    <ellipse cx="750" cy="120" rx="100" ry="100" />
    <ellipse cx="100" cy="420" rx="180" ry="180" />
    <ellipse cx="100" cy="420" rx="140" ry="140" />
  </g>

  <!-- Top Left: Yenat Market Branding -->
  <g transform="translate(60, 52)">
    <text x="0" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="url(#goldGradient)">
      YENAT MARKET
    </text>
    <text x="0" y="58" font-family="'Noto Sans Ethiopic', 'Nyala', sans-serif" font-weight="700" font-size="20" letter-spacing="3" fill="#86efac">
      የእናት ገበያ · LAS VEGAS
    </text>
    <text x="0" y="80" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" letter-spacing="2" fill="#6ee7b7" opacity="0.85">
      4780 W TROPICANA AVE · SUITE 102
    </text>
  </g>

  <!-- Top Right: Accepted Daily Seal -->
  <g transform="translate(730, 95)">
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" stroke-dasharray="4,2"/>
    <circle cx="0" cy="0" r="36" fill="#042013" stroke="url(#goldGradient)" stroke-width="1.5"/>
    <text x="0" y="-8" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="11" letter-spacing="1" fill="#ffe28a">
      CASH
    </text>
    <text x="0" y="8" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#34d399">
      &amp; DEBIT
    </text>
    <text x="0" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="9" letter-spacing="1" fill="#ffe28a">
      ACCEPTED
    </text>
  </g>

  <!-- Gold EMV Smart Chip -->
  <g transform="translate(60, 190)">
    <rect x="0" y="0" width="86" height="66" rx="12" ry="12" fill="url(#chipGrad)" stroke="#78350f" stroke-width="1.5"/>
    <!-- Chip Contact Lines -->
    <path d="M 0 33 L 86 33 M 28 0 L 28 66 M 58 0 L 58 66 M 28 20 L 0 20 M 28 46 L 0 46 M 58 20 L 86 20 M 58 46 L 86 46" 
          stroke="#78350f" stroke-width="1.8" fill="none" opacity="0.85"/>
    <rect x="28" y="20" width="30" height="26" rx="4" fill="none" stroke="#78350f" stroke-width="1.5"/>
  </g>

  <!-- Contactless Payment Icon -->
  <g transform="translate(165, 208)" stroke="url(#goldGradient)" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 0 10 A 12 12 0 0 1 0 30" opacity="0.6"/>
    <path d="M 8 5 A 18 18 0 0 1 8 35" opacity="0.8"/>
    <path d="M 16 0 A 24 24 0 0 1 16 40"/>
  </g>

  <!-- Embossed Card Label / Type -->
  <g transform="translate(60, 315)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="900" font-size="28" letter-spacing="6" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.5))">
      STORE CASH &amp; DEBIT
    </text>
    <text x="0" y="28" font-family="monospace" font-weight="700" font-size="22" letter-spacing="8" fill="#e2e8f0" opacity="0.95" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.6))">
      •••• •••• •••• 1002
    </text>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(60, 435)">
    <text x="0" y="14" font-family="system-ui, sans-serif" font-weight="600" font-size="11" letter-spacing="2" fill="#86efac" opacity="0.9">
      VALUED PATRON
    </text>
    <text x="0" y="38" font-family="system-ui, sans-serif" font-weight="800" font-size="18" letter-spacing="3" fill="#ffffff">
      AUTHENTIC ETHIOPIAN MARKET
    </text>
  </g>

  <!-- Bottom Right: In-Store & Delivery Badge -->
  <g transform="translate(560, 442)">
    <rect x="0" y="0" width="236" height="42" rx="10" fill="#042013" stroke="url(#goldGradient)" stroke-width="1.5"/>
    <text x="118" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="13" letter-spacing="1.5" fill="#ffe28a">
      IN-STORE &amp; VAN DELIVERY
    </text>
  </g>
</svg>
